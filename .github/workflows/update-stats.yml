
name: Update README Stats

on:
  push:
    paths:
      - "stats.json"
  workflow_dispatch: {}

jobs:
  update-stats:
    runs-on: ubuntu-latest
    # avoid an infinite loop: don't run again on the commit this workflow itself makes
    if: "${{ !contains(github.event.head_commit.message, 'chore: update stats charts') }}"
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate stats charts in README
        run: python3 scripts/update_readme_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update stats charts"
          git push
